defaults:
  B1-P1-6: &B1-P1-6  {name: B1-P1-6,              short: B1-P1-6,  angle: 30, offset: 20,  HV: 230,  role: extra}
  PT-IH5: &PT-IH5    {name: ET2.02 PacTech IH-5,  short: PT-IH5,   angle: 30, offset: 20,  HV: 230,  role: ref}
  PT-IH3: &PT-IH3    {name: ET2.02 PacTech IH-3,  short: PT-IH3,   angle: 30, offset: 20,  HV: 230,  role: trig}
  B1-P1-9: &B1-P1-9  {name: B1-P1-9,              short: B1-P1-9,  angle: 30, offset: 20,  HV: 220,  role: dut}

  # PT-IH27_60deg: &PT-IH27_60deg {<<: *PT-IH27, angle: 60, role: extra}
